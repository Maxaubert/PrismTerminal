appId: com.prism.terminal
productName: Prism Terminal
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,.prettierrc.yaml,.prettierignore,eslint.config.js,tsconfig*.json}'
  - '!{.git,.claude,docs,test}/*'
  - '!tools/**'
  - '!build/**'
  - '!assets/**'
  - '!dist/**'
  # The e2e's cache (a 75 MB test model), its screenshots, the core's source
  # (compiled into out/ already) and the speech engine, which ships through
  # extraResources below: left in, the first alone added 73 MB to the installer
  # (MEASURED, 110 MB -> 184 MB, the day dictation landed).
  - '!.e2e-cache/**'
  - '!.e2e-shots/**'
  - '!vendor/**'
  - '!core/**'
# node-pty is the app's one native module. Its .node binaries, the conpty
# helper dir and winpty-agent.exe must live on the real file system - Windows
# cannot spawn an exe or load a DLL out of an asar archive.
asarUnpack:
  - node_modules/node-pty/**
# ...and it needs NO rebuild: 1.1.0 ships N-API prebuilds that load under this
# Electron unchanged. Left on, the default @electron/rebuild insists on
# recompiling from source and dies in node-gyp.
npmRebuild: false
extraResources:
  - from: build/icon.ico
    to: icon.ico
  # The speech engine for dictation (#13): whisper.cpp's official CPU build,
  # fetched by `npm run fetch:bin` against a pinned SHA-256. Beside the app, not
  # in the asar: it is an exe and its DLLs, and Windows has to be able to run it.
  - from: vendor/whisper
    to: bin/whisper
  # The Claude Code plugin that reports an agent's state to its tab (#131):
  # Claude loads it from CLAUDE_CODE_PLUGIN_DIRS, so it has to be real files
  # on disk, never inside the asar (core/** is left out of it above).
  - from: core/claude-plugin
    to: claude-plugin
  # The opt-in orchestrator plugin (2026-10-16): added to a shell only when
  # Settings > Agents > Orchestrator is on.
  - from: core/claude-plugin-orchestrator
    to: claude-plugin-orchestrator
  # The app's one helper (2026-10-17): the DWM attributes and the dictation
  # key's keyboard hook, in one PowerShell.
  - from: src/main/hook
    to: app-helper
  # The resident Parakeet host (2026-10-17): the model kept loaded.
  - from: core/dictation-host
    to: dictation-host
win:
  icon: build/icon.ico
  executableName: PrismTerminal
  target:
    - target: nsis
      arch: [x64]
  artifactName: PrismTerminal-Setup-${arch}-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
  allowElevation: false
  include: build/installer.nsh
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  createDesktopShortcut: false
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
publish: null
